[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "markettwin-database"
version = "0.1.0"
description = "Shared database infrastructure for MarketTwin services"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg>=0.30,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/markettwin_database"]