[project]
name = "markettwin-workspace"
version = "0.1.0"
description = "MarketTwin V1 enterprise agentic product-testing platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "markettwin-control-api",
    "markettwin-database",
    "markettwin-evaluation-worker",
    "markettwin-execution-orchestrator",
    "markettwin-knowledge-worker",
    "markettwin-shared-python",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "ruff>=0.11,<1.0",
    "pyright>=1.1,<2.0",
]

[tool.uv]
package = false

[tool.uv.sources]
markettwin-control-api = { workspace = true }
markettwin-database = { workspace = true }
markettwin-evaluation-worker = { workspace = true }
markettwin-execution-orchestrator = { workspace = true }
markettwin-knowledge-worker = { workspace = true }
markettwin-shared-python = { workspace = true }

[tool.uv.workspace]
members = [
    "services/control-api",
    "services/knowledge-worker",
    "services/execution-orchestrator",
    "services/evaluation-worker",
    "packages/database-python",
    "packages/shared-python",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = [
    "services",
    "packages",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "ASYNC",
]
ignore = []

[tool.pytest.ini_options]
testpaths = [
    "services/control-api/tests",
    "services/knowledge-worker/tests",
    "services/execution-orchestrator/tests",
    "services/evaluation-worker/tests",
    "packages/shared-python/tests",
]
addopts = "-ra --import-mode=importlib"
asyncio_mode = "auto"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
include = [
    "services",
    "packages/database-python",
    "packages/shared-python",
]
exclude = [
    "**/__pycache__",
    ".venv",
]
