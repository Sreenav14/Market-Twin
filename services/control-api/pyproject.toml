[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "markettwin-control-api"
version = "0.1.0"
description = "MarketTwin FastAPI control plane"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]==0.139.2",
    "markettwin-shared-python",
    "markettwin-database",
    "pydantic-settings>=2.14.2",
]

[tool.uv.sources]
markettwin-shared-python = { workspace = true }
markettwin-database = { workspace = true }


[tool.hatch.build.targets.wheel]
packages = ["src/markettwin_control_api"]
