[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "markettwin-execution-orchestrator"
version = "0.1.0"
description = "MarketTwin Google ADK execution orchestrator"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-adk[mcp]==2.5.0",
    "litellm==1.93.0",
    "markettwin-database",
    "markettwin-shared-python",
]

[tool.uv.sources]
markettwin-database = { workspace = true }
markettwin-shared-python = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/markettwin_execution_orchestrator"]
