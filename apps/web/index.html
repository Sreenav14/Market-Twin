<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#FAF7F1" />
    <meta
      name="description"
      content="MarketTwin helps product teams evaluate authorized applications through dynamic simulated-user perspectives and evidence-backed studies."
    />
    <title>MarketTwin</title>
    <script>
      (function() {
        try {
          // One product theme: the warm concept (light). A stored preference
          // from the retired dual-theme era no longer changes the palette.
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.classList.remove('dark');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', '#FAF7F1');
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
