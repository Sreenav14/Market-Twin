name: marketTwin-local

services:
  postgres:
    image: pgvector/pgvector:0.8.5-pg17
    container_name: marketTwin-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marketTwin}
      POSTGRES_USER: ${POSTGRES_USER:-marketTwin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sreenav1}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

    networks:
      - marketTwin-network

  kafka:
    image: apache/kafka:4.1.2
    container_name: marketTwin-kafka
    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LOG_DIRS: /var/lib/kafka/data

      KAFKA_LISTENERS: >-
        CONTROLLER://:9093,
        INTERNAL://:29092,
        EXTERNAL://:9092

      KAFKA_ADVERTISED_LISTENERS: >-
        INTERNAL://kafka:29092,
        EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        CONTROLLER:PLAINTEXT,
        INTERNAL:PLAINTEXT,
        EXTERNAL:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1

    volumes:
      - kafka_data:/var/lib/kafka/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"
        ]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

    networks:
      - marketTwin-network

  minio:
    image: minio/minio:latest
    container_name: marketTwin-minio
    restart: unless-stopped

    command:
      - server
      - /data
      - --console-address
      - ":9001"

    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-marketTwin-local}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-sreenav1}

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

    networks:
      - marketTwin-network

  minio-init:
    image: minio/mc:latest
    container_name: marketTwin-minio-init

    depends_on:
      minio:
        condition: service_started

    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-marketTwin-local}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-sreenav1}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-marketTwin-local}

    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Waiting for MinIO..."

        until mc alias set \
          local \
          http://minio:9000 \
          "$${MINIO_ROOT_USER}" \
          "$${MINIO_ROOT_PASSWORD}"
        do
          sleep 2
        done

        echo "Creating MarketTwin bucket..."

        mc mb \
          --ignore-existing \
          "local/$${MINIO_BUCKET_NAME}"

        echo "MinIO bucket created successfully"

    networks:
      - marketTwin-network

volumes:
  postgres_data:
    name: marketTwin-postgres-data

  kafka_data:
    name: marketTwin-kafka-data

  minio_data:
    name: marketTwin-minio-data

networks:
  marketTwin-network:
    name: marketTwin-network
    driver: bridge
